<html lang="en-GB">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7F1; --cream-deep:#F4EDE2;
    --ink:#22243B; --ink-soft:#575A78;
    --lavender:#6E62E5; --lavender-deep:#4E3FD1;
    --peach:#FFC49B; --mint:#AEE3C8; --coral:#FF7A59;
    --line:#E7DFD1;
    --radius-lg:24px; --radius-md:16px;
    --shadow:0 20px 45px -20px rgba(34,36,59,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;margin:0;}
  a{color:inherit;text-decoration:none;}

  .topbar{
    height:68px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:#fff;position:sticky;top:0;z-index:10;
  }
  .tb-left{display:flex;align-items:center;gap:18px;}
  /* ---------- LANGUAGE TOGGLE ---------- */
  .lang-toggle{display:flex;background:var(--cream-deep);border-radius:999px;padding:3px;gap:2px;flex-shrink:0;}
  .lang-btn{border:none;background:transparent;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;letter-spacing:.02em;font-family:'Inter',sans-serif;}
  .lang-btn.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(34,36,59,.15);}
  .exit{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .exit svg{width:16px;height:16px;}
  .divider{width:1px;height:22px;background:var(--line);}
  .course-name{font-size:14.5px;font-weight:700;}
  .tb-progress{display:flex;align-items:center;gap:12px;}
  .bar-track{width:160px;height:8px;border-radius:4px;background:var(--cream-deep);overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--lavender),var(--coral));border-radius:4px;transition:width .3s ease;}
  .bar-label{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .streak-badge{
    display:flex;align-items:center;gap:5px;
    background:#FFF1E8;border-radius:999px;padding:6px 12px;
    font-size:13.5px;font-weight:700;color:#B8531F;
    transition:transform .2s ease;
  }
  .streak-badge.zero{background:var(--cream-deep);color:var(--ink-soft);}
  .streak-badge .streak-flame{font-size:14px;line-height:1;filter:grayscale(0);}
  .streak-badge.zero .streak-flame{filter:grayscale(1);opacity:.5;}
  .streak-badge.pop{animation:streakPop .4s ease;}
  @keyframes streakPop{
    0%{transform:scale(1);}
    45%{transform:scale(1.2);}
    100%{transform:scale(1);}
  }

  .layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 68px);}

  .sidebar{border-right:1px solid var(--line);background:#fff;padding:26px 20px;overflow-y:auto;}
  .sidebar-head{margin-bottom:18px;}
  .sidebar-head .tag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:#E4E0FB;color:var(--lavender-deep);padding:5px 10px;border-radius:999px;margin-bottom:10px;
  }
  .sidebar-head h2{font-size:19px;line-height:1.3;}
  .lesson-item{
    display:flex;align-items:flex-start;gap:12px;padding:13px 10px;border-radius:12px;
    cursor:pointer;margin-bottom:2px;
  }
  .lesson-item.active{background:var(--cream-deep);}
  .lesson-item:hover:not(.active){background:#FAF8F3;}
  .l-marker{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    border:2px solid var(--line);color:var(--ink-soft);
  }
  .l-marker.done{background:var(--mint);border-color:var(--mint);color:#276648;}
  .l-marker.current{border-color:var(--lavender);color:var(--lavender-deep);background:#EFEBFC;}
  .l-title{font-size:14px;font-weight:600;line-height:1.4;}
  .l-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .content{padding:52px 64px;max-width:760px;}
  .lesson-tag{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--lavender-deep);margin-bottom:14px;display:block;}
  .content h1{font-size:clamp(26px,3vw,34px);line-height:1.2;margin-bottom:26px;}
  .lesson-image{width:100%;max-width:620px;border-radius:var(--radius-md);overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow);}
  .lesson-image img{width:100%;height:260px;object-fit:cover;display:block;}
  .content p{font-size:16.5px;line-height:1.7;color:var(--ink);margin-bottom:20px;max-width:620px;}
  .content p.lead{font-size:18px;}
  .callout{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);
    padding:22px 24px;margin:30px 0;display:flex;gap:14px;align-items:flex-start;max-width:620px;
  }
  .callout-icon{width:34px;height:34px;border-radius:10px;background:var(--peach);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .callout-icon svg{width:18px;height:18px;}
  .callout p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-soft);}
  .callout p strong{color:var(--ink);}

  /* ---------- MODULE TEST (10 questions, 80% to pass) ---------- */
  .quiz-box{
    margin-top:44px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow);overflow:hidden;max-width:620px;
  }
  .quiz-top{background:var(--ink);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;}
  .quiz-body{padding:26px 24px 28px;}
  .quiz-q{margin-bottom:26px;}
  .quiz-q:last-of-type{margin-bottom:20px;}
  .quiz-q-text{font-size:15px;font-weight:600;margin-bottom:12px;line-height:1.4;}
  .quiz-opts{display:flex;flex-direction:column;gap:8px;}
  .qopt{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;
    border:1.5px solid var(--line);font-size:14px;font-weight:500;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .qopt:hover{border-color:#CFC7F5;}
  .qopt .qdot{width:16px;height:16px;border-radius:50%;border:2px solid #CFC8B6;flex-shrink:0;}
  .qopt.qopt-selected{border-color:var(--lavender);background:#F5F3FE;}
  .qopt.qopt-selected .qdot{border-color:var(--lavender);background:var(--lavender);}
  .qopt.qopt-correct{border-color:#4E9E76;background:#EEF9F2;color:#276648;}
  .qopt.qopt-correct .qdot{border-color:#4E9E76;background:#4E9E76;}
  .qopt.qopt-wrong{border-color:#E88B72;background:#FDF1EC;color:#B5502F;}
  .qopt.qopt-wrong .qdot{border-color:#E88B72;background:#E88B72;}
  .quiz-explain{display:none;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--cream-deep);font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .quiz-explain.show{display:block;}
  .quiz-warn{color:#B5502F;font-size:13.5px;margin-bottom:14px;}
  .quiz-pass{color:#1E5C3B;background:#EEF9F2;padding:14px 16px;border-radius:12px;font-weight:700;font-size:14.5px;margin-bottom:16px;}
  .quiz-fail{color:#8A3A1F;background:#FDF1EC;padding:14px 16px;border-radius:12px;font-weight:600;font-size:14.5px;margin-bottom:16px;}
  .quiz-fail a{text-decoration:underline;color:#8A3A1F;font-weight:700;cursor:pointer;}

  .content-nav{display:flex;justify-content:space-between;align-items:center;margin-top:48px;max-width:620px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:14.5px;border:none;cursor:pointer;}
  .btn-primary{background:var(--ink);color:var(--cream);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn-outline:disabled{opacity:.4;cursor:not-allowed;}
  .btn-locked{opacity:.4;pointer-events:none;cursor:not-allowed;}
  .continue-note{font-size:12.5px;color:var(--ink-soft);margin-top:10px;}

  .complete-screen{max-width:620px;text-align:center;padding:60px 0;}
  .complete-badge{
    width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--mint),#7FD1A8);
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
  }
  .complete-badge svg{width:38px;height:38px;}
  .complete-screen h1{margin-bottom:14px;}
  .complete-screen p{color:var(--ink-soft);font-size:16px;max-width:440px;margin:0 auto 22px;}
  .streak-summary{
    display:inline-flex;align-items:center;gap:10px;
    background:#FFF1E8;border-radius:999px;padding:12px 24px;
    font-weight:700;color:#B8531F;font-size:15.5px;margin:0 auto 26px;
  }
  .streak-summary .flame{font-size:20px;line-height:1;}

  .cert-box{
    background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:28px 30px;margin:0 auto 26px;max-width:440px;text-align:left;
  }
  .cert-box-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin-bottom:8px;}
  .cert-box-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:18px;}
  .cert-form{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .cert-form input{
    padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);
    width:100%;box-sizing:border-box;
  }
  .cert-form input:focus{outline:none;border-color:var(--lavender);}
  .cert-error{color:#B5502F;font-size:12.5px;margin-top:10px;min-height:1em;}

  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
  .confetti-piece{
    position:absolute;top:-20px;border-radius:2px;opacity:.95;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(105vh) rotate(600deg);opacity:.15;}
  }

  @media(max-width:880px){
    .layout{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .content{padding:36px 22px;}
    .lesson-image img{height:200px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-left">
    <span class="exit" onclick="exitCourse()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="exit-label">Exit</span>
    </span>
    <div class="divider"></div>
    <span class="course-name" id="course-name">Challenge 25 &amp; Acceptable ID</span>
  </div>
  <div class="tb-progress">
    <div class="lang-toggle">
      <button type="button" class="lang-btn active" data-lang="en" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" data-lang="cy" onclick="setLang('cy')">CY</button>
    </div>
    <div class="streak-badge zero" id="streak-badge" title="Module tests passed at 80%+ on the first attempt, in a row">
      <span class="streak-flame">🔥</span><span id="streak-count">0</span>
    </div>
    <span class="bar-label" id="progress-label">1 of 9</span>
    <div class="bar-track"><div class="bar-fill" id="progress-fill" style="width:12.5%"></div></div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <img src="images/challenge25-poster.svg" alt="Illustration of a till-side Challenge 25 ID check" style="width:100%;height:104px;object-fit:cover;object-position:50% 42%;border-radius:14px;display:block;margin-bottom:14px;">
      <span class="tag" id="sidebar-tag">All staff · ~65 mins</span>
      <h2 id="sidebar-h2">Challenge 25 &amp; Acceptable ID</h2>
    </div>
    <div id="sidebar-list"></div>
  </aside>

  <main class="content" id="content"></main>
</div>

<script>
const ALL_LESSONS = [
  {
    title: "Why Challenge 25 exists",
    meta: "8 min",
    image: "images/lesson-1.svg",
    imageAlt: "A UK corner shop counter selling food, news, and everyday goods",
    lead: "It's against the law to sell alcohol to anyone under 18 — anywhere in the UK, no exceptions. Get it wrong and the penalties are real: an unlimited fine for the store, a fine or even a short prison sentence for the individual seller, and a personal licence that can be reviewed or revoked.",
    body: [
      "The problem is that guessing someone's age just by looking at them is hard. Most people are worse at it than they think — which is exactly the situation Challenge 25 is designed for.",
      "Instead of trying to spot exactly who's under 18, staff ask for ID from anyone who looks under 25. Get that guess wrong at 25, and you're still nowhere near selling to someone underage. Get it wrong at 18, and you might have just broken the law.",
      "Underage sales don't only get caught in the moment — a lot get picked up afterwards, through CCTV review, a parent's complaint, or a Trading Standards test purchase where someone genuinely under 18 is sent in to try buying. None of those checks care how busy the shop was or how confident the customer seemed.",
      "Through this course, you'll see that process broken down into three steps worth building into habit: ASK if a customer looks under 25, CHECK their ID is valid and genuine, and DECIDE — complete the sale or refuse. Remember ACD: Ask, Check, Decide."
    ],
    callout: "<strong>The key idea:</strong> Challenge 25 isn't a stricter rule than the law requires. It's part of building the store's <em>due diligence</em> — proof that all reasonable precautions were taken to prevent underage sales, which is exactly what the law looks for as a defence.",
    quiz: [
      { q: "What is the legal minimum age to buy alcohol in the UK?", opts: ["16","18","21","25"], correct: 1, explain: "18 is the legal age everywhere in the UK — Challenge 25 doesn't change this, it just builds in a margin for error." },
      { q: "What does the \"25\" in Challenge 25 actually represent?", opts: ["A separate legal drinking age","A safety margin for judging age accurately","A minimum staff age to sell alcohol","A loyalty scheme threshold"], correct: 1, explain: "The 25 threshold exists purely as a buffer against misjudging age — it isn't a separate legal drinking age." },
      { q: "Who can be personally liable if alcohol is knowingly sold to someone underage?", opts: ["Only the store, never the individual","The individual member of staff who made the sale","Only the store manager","No one — it's a civil matter only"], correct: 1, explain: "Individual staff can be personally fined (or in serious cases prosecuted) for a knowing sale — it isn't only the store's problem." },
      { q: "Which of these can happen to a store's licence after a proven underage sale?", opts: ["Nothing, licences can't be affected by staff mistakes","It can be reviewed or revoked by the licensing authority","It's automatically suspended for one day","It's transferred to a different manager"], correct: 1, explain: "A proven underage sale can trigger a licence review, and in serious or repeated cases, revocation." },
      { q: "How are most underage sales actually detected?", opts: ["Only if the customer later admits it","Test purchase operations, CCTV review, or complaints","Random till audits of cash only","They're never detected"], correct: 1, explain: "Trading Standards test purchases, CCTV, and complaints are the main ways underage sales come to light — often well after the sale happened." },
      { q: "True or false: Challenge 25 is a stricter legal requirement than the Licensing Act itself.", opts: ["True — it raises the legal age to 25","False — it's a practical margin for error, the legal age stays 18","True, but only in Scotland","False — it replaces the Licensing Act"], correct: 1, explain: "Challenge 25 is a due diligence practice sitting on top of the law, not a separate or stricter law." },
      { q: "Why might a customer who looks confident and calm still be underage?", opts: ["Confidence has no bearing on someone's actual age","Confident customers are always over 18","Store policy assumes confident customers are safe to serve","It's illegal to consider confidence at all"], correct: 0, explain: "How someone carries themselves says nothing about their date of birth — that's exactly why Challenge 25 relies on ID, not impressions." },
      { q: "What is \"due diligence\" in the context of underage sales law?", opts: ["A discount scheme for loyal customers","Proof that all reasonable precautions were taken to prevent an illegal sale","A type of till receipt","A synonym for Challenge 25 signage"], correct: 1, explain: "Due diligence is the legal defence built from things like Challenge 25, proper ID checks, and refusal logs, together." },
      { q: "If a till operator sells alcohol to someone under 18 without checking ID, who bears responsibility?", opts: ["Nobody, if it was a genuine mistake","Potentially both the staff member and the store","Only the customer, for lying about their age","Only store insurance covers it"], correct: 1, explain: "Both the individual seller and the store can carry responsibility for an unlawful sale." },
      { q: "What's the main purpose of asking for ID from anyone who looks under 25?", opts: ["To slow down busy tills on purpose","To create a buffer so genuine underage sales are far less likely","To meet a head-office sales target","To collect customer data for marketing"], correct: 1, explain: "The 25 threshold exists to make genuinely underage sales far less likely, even when staff misjudge someone's age." }
    ]
  },
  {
    title: "Who to challenge, and why it's applied consistently",
    meta: "7 min",
    image: "images/lesson-2.svg",
    imageAlt: "A card payment terminal and blank card, representing a consistent till check",
    lead: "Challenge 25 only works if it's applied the same way to everyone who looks under 25 — including regulars, people in work uniforms, and people who insist they're older.",
    body: [
      "The moment the rule becomes negotiable, it stops being a legal safeguard and starts being a matter of opinion — which is exactly what gets tested if a sale is ever challenged by a licensing officer.",
      "If a colleague declines a sale, backing that decision in the moment (rather than overturning it in front of the customer) matters just as much as the original check. Reversing a refusal live tells staff their judgement isn't trusted, and undermines the whole scheme.",
      "It works the other way too — a staff member who is themselves under 18 can still refuse a sale, and that refusal carries exactly the same weight. Consistency isn't about how experienced or senior the person checking ID is; it's about applying the same standard, every time, to everyone who looks under 25."
    ],
    callout: "<strong>Rule of thumb:</strong> if you'd ask a stranger for ID, ask a regular too. Consistency is what makes the policy defensible.",
    quiz: [
      { q: "Why does consistency matter most for Challenge 25?", opts: ["It looks tidier on paper","Inconsistent enforcement makes the policy easy to challenge and defend against in a licensing review","It's required for staff bonuses","It only matters for CCTV footage"], correct: 1, explain: "A policy applied only sometimes stops looking like genuine enforcement and becomes hard to defend." },
      { q: "A colleague declines a sale. What should you do if the same customer approaches you next?", opts: ["Serve them since a fresh check is fine","Support the original decision and apply the same standard","Apologise to the customer for your colleague's mistake","Ask a manager to override it immediately"], correct: 1, explain: "Backing a colleague's refusal keeps the policy consistent and shows staff judgement is trusted." },
      { q: "Does being a regular customer change the ID requirement?", opts: ["Yes, regulars are exempt after their first check","No — the same standard applies regardless of familiarity","Only if they've been coming in for over a year","Only on weekdays"], correct: 1, explain: "Familiarity doesn't change the standard — the same check applies to everyone who looks under 25." },
      { q: "Can a staff member who is themselves under 18 refuse an alcohol sale?", opts: ["No, only adult staff can refuse sales","Yes — their refusal carries the same weight as anyone else's","Only if a manager is present","Only for tobacco, not alcohol"], correct: 1, explain: "Any staff member's refusal carries the same weight, regardless of their own age." },
      { q: "What happens to Challenge 25 as a defence if it's applied selectively?", opts: ["Nothing changes, it's still a valid defence","It becomes much weaker, since it stops looking like a genuine policy","It becomes stronger, showing staff use judgement","It only affects online sales"], correct: 1, explain: "Selective enforcement weakens the due diligence defence — it needs to look like a real, consistent policy." },
      { q: "A customer in a work uniform (e.g. a delivery driver) looks under 25. What applies?", opts: ["Uniforms are treated as proof of age","The same Challenge 25 standard as anyone else","Uniformed customers are automatically refused","Only ID from a manager is accepted"], correct: 1, explain: "A uniform isn't ID — the same standard applies regardless of what someone is wearing." },
      { q: "Why might overturning a colleague's refusal in front of the customer be harmful?", opts: ["It's fine as long as the second staff member is more senior","It signals that refusals are negotiable, undermining trust in the policy","It has no real effect on anything","It's only a problem if the customer complains"], correct: 1, explain: "Reversing a refusal live tells staff their judgement isn't trusted and weakens the whole scheme." },
      { q: "What's the \"rule of thumb\" for deciding who to ask for ID?", opts: ["Ask everyone under 30 to be extra safe","If you'd ask a stranger, ask a regular too","Only ask if a manager is watching","Ask only when the till system prompts you"], correct: 1, explain: "If you'd check a stranger's ID, the same standard should apply to a regular who looks under 25." },
      { q: "What is being tested if a sale is ever formally challenged by a licensing officer?", opts: ["How fast the till served the customer","Whether the policy was applied consistently, not just when convenient","The store's opening hours","The customer's receipt history"], correct: 1, explain: "A licensing review looks at whether the policy was genuinely and consistently enforced." },
      { q: "Which of these is the best description of a defensible Challenge 25 policy?", opts: ["One applied occasionally, when staff remember","One applied the same way to every customer who looks under 25, without exceptions","One applied only during weekend evenings","One left entirely to staff discretion"], correct: 1, explain: "A defensible policy is one applied the same way, every time, to everyone who looks under 25." }
    ]
  },
  {
    title: "Acceptable forms of ID",
    meta: "8 min",
    image: "images/lesson-3.svg",
    imageAlt: "A wallet with cards, representing the documents someone might offer as ID",
    lead: "Challenge 25 recognises three standard physical forms of ID — a valid passport, a UK photocard driving licence, and a PASS-accredited proof-of-age card — plus, since September 2026, certified digital ID from a small number of approved providers.",
    body: [
      "A PASS-accredited card carries the PASS hologram — that's the detail to look for, since plenty of unofficial \"proof of age\" cards exist without it.",
      "What doesn't count: student cards, workplace ID badges, bank cards, or a photo of someone's ID on their phone. None of these carry the security features needed to confirm both identity and age.",
      "Since 15 September 2026, alcohol sales can also be verified with a certified digital ID — but only from a provider listed on the official GOV.UK register, and only where your store has chosen to support it. The next lesson covers exactly how that works. If your store hasn't set it up, or you're ever unsure about a digital option, treat the sale as requiring one of the three physical forms instead."
    ],
    callout: "<strong>Quick check:</strong> passport, UK photocard driving licence, PASS hologram card — or, where your store supports it, a certified digital ID check. If it's none of those, it isn't acceptable ID under Challenge 25.",
    quiz: [

    callout: "<strong>Cadwch e am y polisi, nid y person.</strong> Mae \"Alla i ddim gwerthu hwn heb ID\" yn glanio'n wahanol iawn i \"Dw i ddim yn credu eich bod chi'n ddigon hen\". Cofiwch: Gofyn, Gwirio, Penderfynu — ac unwaith y byddwch wedi penderfynu, glynwch ato'n dawel.",
    quiz: [
      { q: "Beth yw'r ffordd argymhellir o eirio gwrthodiad?", opts: ["\"Dw i ddim yn meddwl eich bod chi'n ddigon hen\"","\"Mae'n ddrwg gen i, alla i ddim gwerthu hwn heb ID dilys\"","\"Gofynnwch i rywun arall ei brynu i chi\"","\"Mae polisi'r siop yn wirion ond mae'n rhaid i mi ofyn\""], explain: "Mae ei fframio fel polisi, wedi'i ddweud yn dawel, yn cadw'r rhyngweithiad yn broffesiynol ac yn gyson." },
      { q: "Pam mae fframio gwrthodiad o amgylch polisi (nid barn bersonol) yn well?", opts: ["Mae'n swnio'n fwy swyddogol ar gamera","Mae'n osgoi dadl am olwg y cwsmer ac yn cadw pethau'n gyson","Mae'n ofynnol gan eiriad yswiriant","Mae'n gwneud y gwrthodiad yn adferadwy'n hwyrach"], explain: "Mae cadw'r peth am bolisi'n osgoi dadlau am olwg ac yn cadw gorfodaeth yn gyson." },
      { q: "Mae cwsmer yn dweud \"Dw i'n cael fy ngwasanaethu ym mhobman arall\" ar ôl cael ei ofyn am ID. Ymateb gorau?", opts: ["Eu gwasanaethu i osgoi golygfa chwithig","Ailadrodd yn dawel mai polisi'r siop ydyw i unrhyw un sy'n edrych dan 25","Dweud wrthyn nhw eu bod yn amlwg yn edrych dan oed","Gofyn i reolwr eu gwasanaethu yn lle hynny"], explain: "Ailadrodd y polisi'n dawel — heb ddadlau am eu golwg — yw'r ymateb proffesiynol." },
      { q: "Os yw cwsmer yn dod yn ymosodol yn ystod gwrthodiad, beth ddylech chi ei wneud?", opts: ["Parhau i ddadlau nes eu bod nhw'n ildio","Camu'n ôl a chynnwys cydweithiwr neu reolwr","Eu gwasanaethu'n gyflym dim ond i orffen y rhyngweithiad","Eu dilyn i'w car i barhau i drafod"], explain: "Camwch yn ôl a chael cefnogaeth yn hytrach na pharhau â'r sgwrs ar eich pen eich hun." },
      { q: "Pryd mae'n briodol ffonio'r heddlu yn ystod gwrthodiad?", opts: ["Byth, mae'n orymateb i wrthodiad siop","Os byddwch chi byth yn teimlo'n anniogel neu wedi'ch bygwth","Dim ond os yw'r cwsmer yn mynd i mewn i ardal y til yn gorfforol","Dim ond gyda chymeradwyaeth flaenorol y brif swyddfa"], explain: "Mae bob amser yn iawn ffonio'r heddlu os ydych chi'n teimlo'n anniogel — dyw'r un gwerthiant yn werth y risg." },
      { q: "Beth ddylech chi osgoi ei ddweud yn ystod gwrthodiad?", opts: ["\"Polisi'r siop ydyw\"","\"Alla i ddim gwerthu hwn heb ID\"","\"Dw i ddim yn credu eich bod chi'n ddigon hen\"","\"Mae'n ddrwg gen i am hynny\""], explain: "Mae dadlau am olwg rhywun yn gwaethygu pethau — cadwch e am bolisi, nid barn bersonol." },
      { q: "Pam na ddylech chi ddadlau am ba mor hen mae cwsmer yn edrych?", opts: ["Mae'n anghwrtais trafod golwg yn gyhoeddus","Mae dadlau am olwg yn gwaethygu'r sefyllfa ac nid dyna'r safon gwirioneddol sy'n cael ei gymhwyso — ID ydyw","Mae polisi'r siop yn gwahardd trafod oedran o gwbl","Mae'n gwastraffu amser til yn unig"], explain: "Y gwiriad ID yw'r safon, nid barn am olwg — mae dadlau amdano ond yn gwaethygu pethau." },
      { q: "Beth sy'n werth ei wneud yn syth ar ôl unrhyw wrthodiad?", opts: ["Does dim byd arall ei angen","Nodi beth ddigwyddodd, ar gyfer y gofrestr wrthod","Ymddiheuro eto i'r cwsmer","Adrodd wrth Safonau Masnach yn uniongyrchol"], explain: "Mae nodyn cyflym yn syth ar ôl gwrthodiad yn bwydo'n uniongyrchol i mewn i gofrestr wrthod y siop." },
      { q: "Ydy'n ofynnol i aelod o staff gyfiawnhau ei farn i'r cwsmer ar y pryd?", opts: ["Ydy, esboniwch eich rhesymeg lawn bob amser","Nac ydy — mae'r polisi'n berthnasol beth bynnag am roi cyfiawnhad","Dim ond os yw'r cwsmer yn gofyn yn neis","Dim ond os oes rheolwr yn bresennol"], explain: "Mae'r polisi'n berthnasol beth bynnag — does dim rhaid i staff gyfiawnhau eu barn ar y pryd." },
      { q: "Beth yw'r ymagwedd gyffredinol orau i gadw gwrthodiad yn broffesiynol?", opts: ["Aros yn dawel, cadw'r peth am bolisi, cael cefnogaeth os yw'n gwaethygu","Bod yn amddiffynnol i ddangos eich bod o ddifrif","Gwerthu cyfran lai yn lle gwrthod yn llwyr","Gadael i'r cwsmer benderfynu a yw'r polisi'n berthnasol iddyn nhw"], explain: "Tawel, wedi'i ganolbwyntio ar bolisi, a pharod i gael cefnogaeth os oes angen — dyna sy'n cadw gwrthodiad yn broffesiynol." }

  {
    title: "Gwerthiannau dirprwyol — prynu alcohol ar ran rhywun arall",

    body: [

    callout: "<strong>Yn werth ei gofio:</strong> mae'r gyfraith yn trin hwyluso gwerthiant dirprwyol yn fwriadol yr un fath â gwerthu'n uniongyrchol i berson dan oed.",
    quiz: [

      { q: "Ydy hwyluso gwerthiant dirprwyol yn cael ei drin yr un fath â gwerthu'n uniongyrchol i berson dan oed?", opts: ["Nac ydy, trosedd lai ydyw","Ydy — mae'r gyfraith yn trin ei hwyluso'n fwriadol yr un fath","Dim ond os yw'r oedolyn yn cyfaddef","Dim ond os yw'n alcohol, nid cynhyrchion eraill"], explain: "Mae hwyluso gwerthiant dirprwyol yn fwriadol yn cario'r un pwysau cyfreithiol â gwerthiant dan oed uniongyrchol." },
      { q: "Mae oedolyn yn prynu potel o fodca tra bod pobl ifanc yn aros y tu allan. Beth ddylai groesi'ch meddwl?", opts: ["Dim byd — dim ond oedran y prynwr sy'n bwysig yn gyfreithiol","Gallai hyn fod yn werthiant dirprwyol, yn werth defnyddio barn amdano","Mae'n iawn cyn belled â'u bod yn talu â cherdyn","Gwrthod yn awtomatig heb air"], explain: "Dyw e ddim o reidrwydd yn golygu ei fod yn werthiant dirprwyol, ond dyna'n union y math o sefyllfa sy'n werth ei sylwi." },
      { q: "Allwch chi wrthod gwerthiant i oedolyn ar sail amheuaeth yn unig, heb unrhyw reswm ategol?", opts: ["Gallwch, gwrthodwch unrhyw oedolyn nad ydych chi'n siŵr amdano","Nid ar sail amheuaeth yn unig — ond dylai arwyddion gwerth eu sylwi barnu o hyd","Na allwch, ni ellir gwrthod oedolion byth","Dim ond os yw rheolwr yn cymeradwyo ymlaen llaw"], explain: "Dyw amheuaeth ar ei ben ei hun ddim yn ddigon i wrthod, ond mae arwyddion gwirioneddol yn werth defnyddio barn arnyn nhw." },
      { q: "Pa un o'r rhain yw arwydd sy'n werth bod yn effro iddo?", opts: ["Oedolyn yn prynu ei siop wythnosol arferol","Pryniant sydd ddim yn amlwg yn cyfateb i batrwm arferol y prynwr, ochr yn ochr ag arwyddion eraill","Unrhyw oedolyn yn prynu alcohol o gwbl","Cwsmer yn defnyddio taliad cyffwrdd"], explain: "Mae patrwm pryniant anarferol, ochr yn ochr ag arwyddion eraill, yn werth rhoi sylw iddo." },
      { q: "Ydy hi'n bwysig pwy sy'n trosglwyddo'r taliad yn gorfforol mewn gwerthiant dirprwyol?", opts: ["Ydy, dyna'r cyfan sy'n bwysig yn gyfreithiol","Nid yn llwyr — mae gwerthiant dirprwyol yn ymwneud â phwy mae'r alcohol wir ar ei gyfer","Ydy, dim ond oedran deiliad y cerdyn sy'n bwysig","Nac ydy, y dull talu sy'n penderfynu"], explain: "Mae gwerthiant dirprwyol yn ymwneud â phwy mae'r alcohol wir wedi'i fwriadu ar ei gyfer, nid dim ond pwy sy'n talu." },
      { q: "Beth yw'r ymateb gorau os ydych chi'n amau gwerthiant dirprwyol ond ddim yn siŵr?", opts: ["Ei anwybyddu, gan na allwch chi fod yn siŵr","Defnyddio barn — does dim rhaid i chi wasanaethu os yw rhywbeth yn teimlo'n anghywir","Gwrthod bob amser ar unwaith heb sgwrs","Gofyn i'r bobl ifanc y tu allan yn uniongyrchol"], explain: "Does dim rhaid i chi wasanaethu os yw rhywbeth yn teimlo'n anghywir — defnyddiwch farn yn hytrach na'i anwybyddu." },
      { q: "Ydy'r cysyniad \"gwerthiant dirprwyol\" yn berthnasol i alcohol yn unig?", opts: ["Ydy, alcohol yn unig","Nac ydy — mae'r un syniad yn berthnasol i gynhyrchion eraill sydd wedi'u cyfyngu yn ôl oedran hefyd","Tybaco'n unig","Tân gwyllt yn unig"], explain: "Mae'r un syniad — rhywun yn prynu ar ran rhywun dan oed — yn berthnasol i gynhyrchion eraill sydd wedi'u cyfyngu yn ôl oedran hefyd." },
      { q: "Pam na all siop ddim ond anwybyddu gwerthiannau dirprwyol fel \"nid ei broblem\"?", opts: ["Gall — dim ond y prynwr oedolyn sy'n gyfrifol erioed","Mae hwyluso un yn fwriadol yn cario'r un risg gyfreithiol â gwerthiant dan oed uniongyrchol","Mater enw da yn unig ydyw, nid un cyfreithiol","Dim ond os caiff ei ddal ar gamera mae'n bwysig"], explain: "Mae hwyluso gwerthiant dirprwyol yn fwriadol yn cario risg gyfreithiol wirioneddol i'r siop, nid risg enw da'n unig." },
      { q: "Beth yw cam cyntaf rhesymol os ydych chi'n amheus am bryniant?", opts: ["Cyhuddo'r cwsmer o brynu ar ran rhywun dan oed","Oedi, defnyddio barn, a phenderfynu a ddylid ei godi neu wrthod","Ffonio'r heddlu ar unwaith bob tro","Gwasanaethu'n gyflym i osgoi gwrthdaro"], explain: "Oedi i ddefnyddio barn yw'r cam cyntaf rhesymol, yn hytrach na chyhuddo neu wasanaethu ar beilot awtomatig." }

// Scotland gets its own edition, chosen via ?region=scotland: it drops the
// digital ID module (that rule change doesn't extend to Scotland) and swaps
// in Scotland-specific wording anywhere else that referenced it, via each
// lesson's optional `regionOverrides.scotland`.
const courseRegion = new URLSearchParams(location.search).get('region') === 'scotland' ? 'scotland' : 'ew';

function applyRegionOverride(lesson){
  const ov = lesson.regionOverrides && lesson.regionOverrides[courseRegion];
  if (!ov) return lesson;
  const merged = { ...lesson };
  if (ov.lead) merged.lead = ov.lead;
  if (ov.body) merged.body = ov.body;
  if (ov.callout) merged.callout = ov.callout;
  if (ov.quiz) merged.quiz = lesson.quiz.map((q, qi) => ov.quiz[qi] ? { ...q, ...ov.quiz[qi] } : q);
  return merged;
}

function t(key, ...args){
  const entry = UI[currentLang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

// Merges the Welsh translation (when active) over the English lesson data,
// question-by-question for the quiz so the `correct` index — which isn't
// duplicated in the Welsh content — always comes from the English source.
function L(i){
  const en = lessons[i];
  if (currentLang !== 'cy' || !lessonsCY[i]) return en;
  const cy = lessonsCY[i];
  return {
    ...en,
    title: cy.title, meta: cy.meta, imageAlt: cy.imageAlt,
    lead: cy.lead, body: cy.body, callout: cy.callout,
    quiz: en.quiz.map((q, qi) => ({ ...q, q: cy.quiz[qi].q, opts: cy.quiz[qi].opts, explain: cy.quiz[qi].explain }))
  };
}

    </div>

        ${l.quiz.map((q,qi) => `
          <div class="quiz-q" data-qi="${qi}">

function selectAnswer(qi, oi){
  if (quizSubmitted) return;
  quizAnswers[qi] = oi;
  document.querySelectorAll(`.quiz-q[data-qi="${qi}"] .qopt`).forEach(el => {
    el.classList.toggle('qopt-selected', parseInt(el.dataset.oi) === oi);
  });
}

function submitQuiz(){
  const l = L(current);
  if (quizAnswers.includes(null)){
    document.getElementById('quiz-result').innerHTML = `<div class="quiz-warn">${t('answerAll', l.quiz.length)}</div>`;
    return;
  }
  quizSubmitted = true;
  lessonAnswers[current] = quizAnswers.slice();
  paintSubmittedQuiz(l, true);
}

// Paints the graded state of a submitted quiz (highlighted answers, explanations,
// pass/fail banner). Used both for a fresh submission and when re-visiting a
// lesson whose quiz was already answered, so progress doesn't look lost.
function paintSubmittedQuiz(l, isFreshSubmit){
  let correctCount = 0;
  l.quiz.forEach((q, qi) => {
    if (quizAnswers[qi] === q.correct) correctCount++;
    document.querySelectorAll(`.quiz-q[data-qi="${qi}"] .qopt`).forEach(optEl => {
      optEl.style.pointerEvents = 'none';
      const oi = parseInt(optEl.dataset.oi);
      if (oi === q.correct) optEl.classList.add('qopt-correct');
      else if (oi === quizAnswers[qi]) optEl.classList.add('qopt-wrong');
    });
    const explainEl = document.getElementById('explain-'+qi);
    explainEl.textContent = q.explain;
    explainEl.classList.add('show');
  });

  const score = Math.round((correctCount / l.quiz.length) * 100);
  const passed = score >= CERT_PASS_RATE;

  document.getElementById('quiz-result').innerHTML = passed
    ? `<div class="quiz-pass">${t('passResult', correctCount, l.quiz.length, score)}</div>`
    : `<div class="quiz-fail">${t('failResult', correctCount, l.quiz.length, score, CERT_PASS_RATE)} <a onclick="retryQuiz();return false;">${t('retryTest')}</a></div>`;
  document.getElementById('quiz-submit-btn').style.display = 'none';

  if (!isFreshSubmit) return;

  if (passed) passedModules.add(current);

  if (!firstAttemptResult[current]){
    firstAttemptResult[current] = { passed, score };
    if (passed){
      streak++;
      if (streak > bestStreak) bestStreak = streak;
    } else {
      streak = 0;
    }
    renderStreak();
  }

  if (passed){
    const contBtn = document.getElementById('continue-btn');
    contBtn.classList.remove('btn-locked');
    const note = document.querySelector('.continue-note');
    if (note) note.remove();
    celebrate();
  }

  renderSidebar();
}

function celebrate(){
  const colors = ['#6E62E5','#FF7A59','#AEE3C8','#FFC49B','#4E3FD1','#276648'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  for (let i = 0; i < 40; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.35) + 's';
    p.style.animationDuration = (2.1 + Math.random() * 1.3) + 's';
    p.style.width = (6 + Math.random() * 6) + 'px';
    p.style.height = (10 + Math.random() * 6) + 'px';
    layer.appendChild(p);
  }
  setTimeout(() => layer.remove(), 3600);
}

function retryQuiz(){
  delete lessonAnswers[current];
  renderContent();
  const box = document.querySelector('.quiz-box');
  if (box) box.scrollIntoView({ block: 'start' });
}

function downloadCertificate(score){
  const nameEl = document.getElementById('cert-name');
  const shopEl = document.getElementById('cert-shop');
  const errEl = document.getElementById('cert-error');
  const name = nameEl.value.trim();
  const shop = shopEl.value.trim();
  if (!name || !shop){
    errEl.textContent = t('certError');
    return;
  }
  errEl.textContent = '';

  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Formatted by hand rather than via toLocaleDateString('cy-GB', ...) — Welsh
  // month names aren't reliably available in every browser's Intl data.
  const now = new Date();
  const cyMonths = ["Ionawr","Chwefror","Mawrth","Ebrill","Mai","Mehefin","Gorffennaf","Awst","Medi","Hydref","Tachwedd","Rhagfyr"];
  const date = currentLang === 'cy'
    ? `${now.getDate()} ${cyMonths[now.getMonth()]} ${now.getFullYear()}`
    : now.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
  const htmlLang = currentLang === 'cy' ? 'cy' : 'en-GB';

  const html = `<!DOCTYPE html>
<html lang="${htmlLang}"><head><meta charset="UTF-8"><title>${esc(t('certTitle', name))}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' fill='%234E3FD1'/%3E%3Cpath d='M8.3 12.3L10.8 14.8L16 9.3' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FBF7F1;font-family:'Inter',sans-serif;color:#22243B;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;box-sizing:border-box;}
  .cert{width:100%;max-width:760px;background:#fff;border:1px solid #E7DFD1;border-radius:28px;padding:64px;text-align:center;box-shadow:0 20px 45px -20px rgba(34,36,59,0.25);}
  .mark{width:44px;height:44px;margin:0 auto 20px;}
  .mark svg{width:100%;height:100%;display:block;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin-bottom:36px;}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#575A78;margin-bottom:10px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;margin:0 0 30px;}
  .name{font-family:'Fraunces',serif;font-weight:700;font-size:34px;margin:6px 0;}
  .shop{font-size:16px;color:#575A78;margin-bottom:28px;}
  .meta{font-size:14px;color:#575A78;margin-bottom:36px;}
  .meta strong{color:#22243B;}
  .disclaimer{font-size:12px;color:#8A8D9E;max-width:520px;margin:0 auto;line-height:1.6;border-top:1px solid #E7DFD1;padding-top:24px;}
  @media print{ body{padding:0;} .cert{box-shadow:none;border:none;} }
</style></head>
<body>
  <div class="cert">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#4E3FD1"/><path d="M8.3 12.3L10.8 14.8L16 9.3" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="brand">AskFirst</div>
    <div class="kicker">${t('certKicker')}</div>
    <h1>${t('courseName')}</h1>
    <div class="name">${esc(name)}</div>
    <div class="shop">${esc(shop)}</div>
    <div class="meta">${t('certMeta', date, lessons.length, score)}</div>
    <div class="disclaimer">${t('certDisclaimer')}</div>
  </div>
</body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AskFirst-Certificate-${name.replace(/\s+/g,'-')}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if (window.goatcounter && window.goatcounter.count){
    window.goatcounter.count({ path: 'certificate-download', title: 'Certificate downloaded', event: true });
  }
}

function goTo(i){
  current = i;
  renderAll();
}
function nextLesson(){
  if (!passedModules.has(current)) return;
  current++;
  renderAll();
}
function prevLesson(){
  if (current > 0){ current--; renderAll(); }
}
function renderAll(){
  renderSidebar();
  renderProgress();
  renderContent();
  window.scrollTo(0,0);
}

(function initLang(){
  let saved = 'en';
  try { saved = localStorage.getItem('checkpoint-lang') || 'en'; } catch(e){}
  currentLang = saved === 'cy' ? 'cy' : 'en';
  updateLangUI();
})();
renderAll();
</script>

<script data-goatcounter="https://smartchoice.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>

      <rect x="-56" y="46" width="112" height="10" rx="5" fill="#22243B" opacity="0.35"/>
    </g>

    <!-- prohibition slash over the calendar, marking the sale as blocked -->
    <g transform="translate(800,270) rotate(4)">
      <circle r="106" fill="none" stroke="#FF7A59" stroke-width="12"/>
      <line x1="-75" y1="-75" x2="75" y2="75" stroke="#FF7A59" stroke-width="12" stroke-linecap="round"/>
    </g>


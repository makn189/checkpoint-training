      <rect x="-56" y="-70" width="112" height="140" rx="10" fill="#FF7A59" stroke="#22243B" stroke-width="7"/>
      <circle r="28" fill="#FBF7F1" stroke="#22243B" stroke-width="4"/>
      <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#22243B">18</text>
    </g>

    <!-- vape device -->
    <g transform="translate(600,260)">
      <rect x="-26" y="-80" width="52" height="160" rx="12" fill="#AEE3C8" stroke="#22243B" stroke-width="7"/>
      <rect x="-16" y="-112" width="32" height="34" rx="7" fill="#22243B"/>
      <rect x="-11" y="-46" width="22" height="18" rx="4" fill="#22243B" opacity="0.3"/>
    </g>

    <!-- calendar card: fixed date-of-birth cutoff -->
    <g transform="translate(800,270) rotate(4)">
      <rect x="-84" y="-96" width="168" height="176" rx="16" fill="#FBF7F1" stroke="#22243B" stroke-width="8"/>
      <rect x="-84" y="-96" width="168" height="40" rx="16" fill="#22243B"/>
      <rect x="-84" y="-70" width="168" height="14" fill="#22243B"/>
      <text x="0" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#FBF7F1" letter-spacing="1">BORN ON OR AFTER</text>

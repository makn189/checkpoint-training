    <rect x="160" y="200" width="880" height="360" rx="16" fill="#6E62E5" opacity="0.12"/>
    <rect x="190" y="310" width="820" height="10" fill="#22243B" opacity="0.25"/>
    <rect x="190" y="470" width="820" height="10" fill="#22243B" opacity="0.25"/>

    <!-- cigarette pack -->
